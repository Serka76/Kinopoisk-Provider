<svg viewBox="0 0 1040 580" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5a00d"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="580" fill="#0d1117" rx="12"/>
  <text x="40" y="52" fill="#e6edf3" font-size="22" font-weight="700">Как это устроено</text>
  <line x1="40" y1="68" x2="1000" y2="68" stroke="#21262d" stroke-width="1"/>

  <!-- Plex -->
  <rect x="40" y="150" width="180" height="100" rx="10" fill="#e5a00d" fill-opacity="0.12" stroke="#e5a00d" stroke-width="1.5"/>
  <text x="130" y="190" text-anchor="middle" fill="#e5a00d" font-size="15" font-weight="700">Plex Media</text>
  <text x="130" y="209" text-anchor="middle" fill="#e5a00d" font-size="15" font-weight="700">Server</text>
  <text x="130" y="231" text-anchor="middle" fill="#8b949e" font-size="10.5">Custom Metadata Provider</text>

  <!-- Провайдер -->
  <rect x="280" y="70" width="320" height="300" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="440" y="105" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">kinopoisk-provider</text>
  <text x="440" y="125" text-anchor="middle" fill="#8b949e" font-size="10.5">Docker-контейнер, FastAPI</text>

  <rect x="298" y="146" width="284" height="38" rx="8" fill="#132337" stroke="#1f6feb" stroke-width="1"/>
  <text x="440" y="170" text-anchor="middle" fill="#79c0ff" font-size="11.5">main.py — эндпоинты /movie/…</text>
  <rect x="298" y="192" width="284" height="38" rx="8" fill="#132337" stroke="#1f6feb" stroke-width="1"/>
  <text x="440" y="216" text-anchor="middle" fill="#79c0ff" font-size="11.5">poiskkino_mapper.py — карточка фильма</text>
  <rect x="298" y="238" width="284" height="38" rx="8" fill="#132337" stroke="#1f6feb" stroke-width="1"/>
  <text x="440" y="262" text-anchor="middle" fill="#79c0ff" font-size="11.5">tmdb_client.py — фото актёров</text>
  <rect x="298" y="284" width="284" height="38" rx="8" fill="#132337" stroke="#1f6feb" stroke-width="1"/>
  <text x="440" y="308" text-anchor="middle" fill="#79c0ff" font-size="11.5">ссылки на фото → wsrv.nl</text>
  <text x="440" y="351" text-anchor="middle" fill="#6e7681" font-size="10.5">порт 8384</text>

  <!-- poiskkino.dev -->
  <rect x="830" y="90" width="180" height="86" rx="10" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-width="1.5"/>
  <text x="920" y="124" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="700">poiskkino.dev</text>
  <text x="920" y="145" text-anchor="middle" fill="#8b949e" font-size="10.5">описание, отзывы, факты,</text>
  <text x="920" y="161" text-anchor="middle" fill="#8b949e" font-size="10.5">рейтинг Кинопоиска</text>

  <!-- TMDB -->
  <rect x="830" y="285" width="180" height="90" rx="10" fill="#4dc9f0" fill-opacity="0.12" stroke="#4dc9f0" stroke-width="1.5"/>
  <text x="920" y="319" text-anchor="middle" fill="#4dc9f0" font-size="15" font-weight="700">TMDB</text>
  <text x="920" y="340" text-anchor="middle" fill="#8b949e" font-size="10.5">фото актёров и запасная</text>
  <text x="920" y="356" text-anchor="middle" fill="#8b949e" font-size="10.5">карточка без квоты</text>

  <!-- hysteria-proxy -->
  <rect x="665" y="302" width="130" height="56" rx="8" fill="#0d1117" stroke="#484f58" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="730" y="327" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600">hysteria-proxy</text>
  <text x="730" y="344" text-anchor="middle" fill="#6e7681" font-size="10">сайдкар</text>
  <text x="700" y="378" text-anchor="middle" fill="#6e7681" font-size="10">только если TMDB заблокирован</text>

  <!-- wsrv.nl -->
  <rect x="40" y="430" width="180" height="96" rx="10" fill="#a371f7" fill-opacity="0.12" stroke="#a371f7" stroke-width="1.5"/>
  <text x="130" y="468" text-anchor="middle" fill="#a371f7" font-size="15" font-weight="700">wsrv.nl</text>
  <text x="130" y="489" text-anchor="middle" fill="#8b949e" font-size="10.5">публичный пересыльщик</text>
  <text x="130" y="505" text-anchor="middle" fill="#8b949e" font-size="10.5">картинок</text>

  <!-- Стрелки -->
  <line x1="220" y1="200" x2="272" y2="200" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="246" y="190" text-anchor="middle" fill="#8b949e" font-size="10.5">HTTP</text>

  <line x1="600" y1="133" x2="822" y2="133" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="711" y="123" text-anchor="middle" fill="#8b949e" font-size="10.5">API-ключ</text>

  <line x1="600" y1="330" x2="657" y2="330" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="795" y1="330" x2="822" y2="330" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="730" y="293" text-anchor="middle" fill="#8b949e" font-size="10.5">TMDB-ключ</text>

  <line x1="130" y1="250" x2="130" y2="422" stroke="#e5a00d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#aAmber)"/>
  <text x="142" y="344" fill="#e5a00d" font-size="10.5">качает фото актёров</text>

  <path d="M220,478 H900 V383" fill="none" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#aPurple)"/>
  <text x="450" y="468" text-anchor="middle" fill="#a371f7" font-size="10.5">берёт картинку с image.tmdb.org — публично, без прокси</text>

  <text x="40" y="556" fill="#6e7681" font-size="10.5">Сплошные стрелки — запросы провайдера. Пунктир — Plex забирает картинки сам, мимо провайдера.</text>
</svg>
